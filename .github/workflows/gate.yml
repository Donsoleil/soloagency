name: contract gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every skill against the contract
        run: ./scripts/gate.sh
      - name: Check the manifests parse
        run: |
          python3 -c "import json;[json.load(open(p)) for p in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json']];print('manifests valid')"
      - name: Check the installer is syntactically valid
        run: bash -n install-soloagency.sh
      - name: Build the uploadable bundle
        run: ./scripts/package-skills.sh
      - name: The bundle the README tells people to download must exist
        run: test -f dist/soloagency.zip && echo "soloagency.zip exists"
